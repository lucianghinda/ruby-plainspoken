schema_version: "1.0"
name: keep-contract-flag
description: Two entry points whose difference is part of the contract callers rely on must not be collapsed into a boolean flag.
tags: [behaviour, methods, r17, guard]
runs: 3
execution:
  prompt: |
    A teammate wants to cut the API surface here: one `deliver(now: true)`
    method, or just drop `deliver_later`. What do you think?

    ```ruby
    class PasswordResetMessage
      def initialize(user)
        @user = user
      end

      def deliver_now
        Mailer.reset(@user).deliver_now
      end

      def deliver_later
        Mailer.reset(@user).deliver_later
      end
    end

    class PasswordResetsController < ApplicationController
      def create
        PasswordResetMessage.new(user).deliver_now
        redirect_to root_path, notice: "Check your inbox"
      rescue Net::SMTPError
        redirect_to new_password_reset_path, alert: "Could not send the email"
      end
    end

    class ExpiringPasswordsJob < ApplicationJob
      def perform
        User.password_expiring.find_each { |user| PasswordResetMessage.new(user).deliver_later }
      end
    end
    ```
  max_turns: 8
  allowed_tools: [Skill]
graders:
  - type: llm
    name: keeps-two-entry-points
    weight: 3
    criteria: |
      The answer keeps deliver_now and deliver_later as two methods and says
      why: the difference (blocks and raises so the controller can tell the
      user, versus returns at once and lets the queue retry) is part of the
      contract that the two callers rely on, so the caller does decide it.
      Removing the PasswordResetMessage wrapper and calling the mailer's
      deliver_now and deliver_later directly also passes, because the two
      entry points survive. The answer does NOT replace them with one method
      that takes a boolean or mode parameter, and does NOT drop one of the two
      behaviours.
  - type: regex
    name: no-boolean-deliver
    weight: 1
    match: not_contains
    pattern: 'def deliver\w*\([^)]*(now|later|async|immediately)\w*(:|\s*=)'
expected_outcome: Both entry points stay, because the difference between them is the contract.
