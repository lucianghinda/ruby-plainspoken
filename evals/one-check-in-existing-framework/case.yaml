schema_version: "1.0"
name: one-check-in-existing-framework
description: A new branch has to leave one focused test behind, written in the framework the repository already runs.
tags: [fixture, tests, r15]
runs: 2
context:
  scaffold_script: ./scaffold.sh
execution:
  prompt: |
    A booking may not be longer than 12 hours. Reject one that is, when it is
    created and when it is rescheduled.

    Then run the tests.
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Edit, Write, Bash, Skill]
graders:
  - type: regex
    name: suite-passes
    weight: 3
    target: trace
    pattern: '0 failures, 0 errors'
  - type: file_exists
    name: no-rspec-added
    weight: 3
    path: spec
    exists: false
  - type: file_exists
    name: no-gemfile-added
    weight: 2
    path: Gemfile
    exists: false
  - type: llm
    name: one-minitest-check-per-branch
    weight: 3
    criteria: |
      The new rule is covered by Minitest tests in the test/ directory, using
      Minitest::Test and the BookingBuilder helper the existing test files use,
      and the tests assert the rejection rather than the happy path only. No
      RSpec file, spec_helper, Gemfile, or standalone `raise unless` script was
      added. The tests are focused on the new rule and do not restate the
      existing behaviour.
expected_outcome: One focused Minitest test per new branch, in the existing test directory, with no second framework.
